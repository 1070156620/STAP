[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-selection-research"
version = "0.1.0"
description = "Reproducible budget-matched educational risk identification and strategy selection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "threadpoolctl>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["support_selection*"]
